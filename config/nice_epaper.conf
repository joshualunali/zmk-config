# Display settings, loaded only by builds with the nice_epaper shield (left and right halves).
# Keep these out of lily58.conf: ZMK also loads that file for lily58_dongle, which has no display.

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10

CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y

CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n

CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_HOR=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_X=4
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_Y=45

CONFIG_NICE_OLED_WIDGET_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n

CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=n

CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_NU=y

#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y
#CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_WPM=n
